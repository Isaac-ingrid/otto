name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # `version` is intentionally omitted: pnpm/action-setup reads the authoritative
      # `packageManager` pin from package.json. Declaring both is a hard error in the action
      # ("Multiple versions of pnpm specified") — and Corepack re-adds the field on every
      # local `pnpm` run when it is missing, so reverting it fights a battle CI keeps losing.
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test deploy/health-monitor.test.mjs
      - run: node --test scripts/improvement/improvement.test.mjs
      - run: pnpm -r typecheck
      - run: pnpm --filter @isaac2ingrid/steward typecheck:node-host
      - run: pnpm -r test
      # The Node host's canonical-origin, client-IP, body-limit, and PR-watch regressions use its own in-process SQLite harness.
      - run: pnpm --filter @isaac2ingrid/steward exec vitest run --config vitest.node.config.ts node-host/testing/public-origin.test.ts test/node-host-client-ip.test.ts node-host/testing/tcp.test.ts node-host/testing/body-limit.test.ts node-host/testing/browser-network.test.ts test/pr-evidence.test.ts test/pr-watch.test.ts test/pr-watch-api.test.ts test/pr-watch-tools.test.ts test/pr-watch-intent.test.ts test/pr-watch-approval.test.ts
      # Scripted faux model + real ledger; no credentials or network, any trust leak fails.
      - run: pnpm --filter @isaac2ingrid/steward eval:memory
      # Deterministic routing selftest; no credentials or model calls.
      - run: pnpm --filter @isaac2ingrid/steward eval:routing:selftest
      # Evaluator-only PR intent observer/scorer; scripted choices, not a real-model pass.
      - run: pnpm --filter @isaac2ingrid/steward eval:pr-intent:selftest
      # Browser smoke suite against local Node steward + scripted faux model + isolated SQLite.
      - run: pnpm --filter @isaac2ingrid/steward exec playwright install --with-deps chromium
      - run: pnpm --filter @isaac2ingrid/steward test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: steward-browser-smoke-artifacts
          path: |
            apps/steward/test-results/
            apps/steward/playwright-report/
          if-no-files-found: ignore
      # Issue #26: the connector must ship as a self-contained `@isaac2ingrid/otto` tarball —
      # bundled dist, bin wrapper, zero runtime dependencies (workspace deps stay in dev).
      # Fail the build if the layout regresses.
      - name: connector tarball layout
        run: |
          cd apps/connector
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          for f in dist/cli.js dist/ext/otto-pi.ts bin/otto.js; do
            grep -q " $f$" /tmp/pack.log || { echo "tarball is missing $f"; exit 1; }
          done
          node -e "const p=require('./package.json'); \
            if (p.dependencies && Object.keys(p.dependencies).length > 0) { \
              console.error('runtime dependencies leaked into the manifest'); process.exit(1); }"

  # ADR-0018: the Windows branches of the connector are platform-parameterized so most of them
  # run on Linux, but the ones that must be real — the Win32_Process CIM query, taskkill, the
  # launcher's shim resolution — only run where Windows exists. This job covers the platform
  # files, not the whole connector suite (POSIX-shaped assertions elsewhere are separate debt).
  windows-connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # The platform tests below include test/supervise-cli.test.ts and test/install-command.test.ts,
      # which spawn the real CLI (`dist/cli.js`) rather than importing src, so the build has to
      # exist first. test/install-service.test.ts does import src, but it belongs to the same
      # install path and is cheap here.
      - run: node build.mjs
        working-directory: apps/connector
      - name: platform tests
        working-directory: apps/connector
        run: pnpm vitest run test/pi-launch.test.ts test/win32.test.ts test/kill.test.ts test/watchdog.test.ts test/daemon-lock.test.ts test/service.test.ts test/install-service.test.ts test/install-command.test.ts test/supervisor.test.ts test/supervise-cli.test.ts test/connect-preflight.test.ts
      # test/windows-live.test.ts is deliberately not run here: it writes the runner's real Run
      # key and starts a hidden process. It is the real-machine acceptance test, run with
      # OTTO_WIN_LIVE_INSTALL=1 (ADR-0018 decision 11).

  node-24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @isaac2ingrid/steward typecheck:node-host
      - run: pnpm --filter @isaac2ingrid/steward exec vitest run --config vitest.node.config.ts test/e2e-loop.test.ts test/turn-stop.test.ts test/crash-window.test.ts test/owner-api-boundaries.test.ts test/event-ack-contract.test.ts node-host/testing/public-origin.test.ts test/node-host-client-ip.test.ts node-host/testing/tcp.test.ts node-host/testing/body-limit.test.ts node-host/testing/browser-network.test.ts
