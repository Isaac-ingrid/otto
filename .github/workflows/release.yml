name: Release

# Publishes @isaac2ingrid/otto (the connector CLI) to npm. Triggered by pushing a `v*` tag
# (e.g. `v0.1.0`) after bumping apps/connector/package.json; requires an NPM_TOKEN secret
# with publish rights for the @isaac2ingrid scope. ADR-0001 decision 10, issue #26.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @isaac2ingrid/otto build
      - run: pnpm --filter @isaac2ingrid/otto typecheck
      - run: pnpm --filter @isaac2ingrid/otto test
      # setup-node v7 no longer supplies a dummy NODE_AUTH_TOKEN. Configure the registry
      # only after dependency installation/tests; the real token remains publish-step-only.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # prepack rebuilds dist into the tarball; the manifest carries no runtime deps.
      - run: npm publish --access public
        working-directory: apps/connector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
