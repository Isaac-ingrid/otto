# Sig steward behind nginx — rendered by deploy/enable-tls.sh; __SIG_DOMAIN__ is substituted.
#
# The service itself stays on 127.0.0.1:8787 and never listens in public. Two headers are not
# optional: node-host/server.ts builds the request origin from `Host` + `X-Forwarded-Proto`,
# and the WebApp stores it (sh_deploy.origin) to mint absolute login links. Drop either one and
# the minted links point at http://127.0.0.1:8787.
#
# Port 80 remains owned by this box's `default` server (the tstock build), so this vhost only
# answers for its own server_name; certbot --nginx adds the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __SIG_DOMAIN__;

    # The steward rejects oversized bodies itself; this only stops nginx from doing it first
    # with a different status. Screenshots and long transcripts fit comfortably.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSockets: the connector relay (/agents/steward/...) and the workspace stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Relays idle for minutes between heartbeats, and SSE must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
