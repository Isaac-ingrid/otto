# Otto steward over TLS on this box's bare IP — no domain, so nothing to file for ICP.
#
# Used when the deployment is reached by IP rather than by name: Let's Encrypt issues for IP
# identifiers now (January 2026, `shortlived` profile, 6-day lifetime), so `https://<ip>` can
# carry a real, publicly trusted certificate. `deploy/NOTES.md` has the issuance and renewal
# runbook, including the renewal window a 6-day certificate needs.
#
# Install (replace __OTTO_IP__ with the address and pick the certificate name used at issuance):
#
#   sed "s/__OTTO_IP__/$IP/g" deploy/nginx-otto-ip.conf > /tmp/otto.conf
#   install -m 644 /tmp/otto.conf /etc/nginx/sites-available/otto
#   ln -sf /etc/nginx/sites-available/otto /etc/nginx/sites-enabled/otto
#   nginx -t && systemctl reload nginx
#
# The service itself stays on 127.0.0.1:8787 and never listens in public.
#
# Port 80 stays owned by this box's `default` server (the tstock build), so this vhost only
# listens on 443: a `server_name <bare IP>` vhost on port 80 silently takes that traffic over,
# which is why the earlier cleartext experiment lived on its own port instead.
#
# Host + X-Forwarded-Proto are load-bearing: node-host/server.ts builds the request origin from
# them, and sameOrigin() (src/index.ts) compares it to the browser's `Origin`.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __OTTO_IP__;

    ssl_certificate     /etc/letsencrypt/live/otto-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otto-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:otto_tls:1m;
    ssl_session_timeout 10m;

    # The steward rejects oversized bodies itself; this only stops nginx from doing it first
    # with a different status. Screenshots and long transcripts fit comfortably.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSockets: the connector relay (/agents/steward/...) and the workspace stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # $http_host, not $host: $host drops the port, and a mismatch here turns every
        # POST /auth/password into 403 {"error":"forbidden"} with the page itself loading fine.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Relays idle for minutes between heartbeats, and SSE must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
