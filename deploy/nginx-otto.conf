# Otto steward behind nginx — rendered by deploy/enable-tls.sh; __OTTO_DOMAIN__ is substituted.
#
# The service stays on 127.0.0.1:8787. Node builds the browser request origin from the
# canonical Host and X-Forwarded-Proto; OTTO_PUBLIC_ORIGIN independently pins absolute
# login links and pairing commands (never trust a caller's Host for those).
#
# Port 80 remains owned by this box's `default` server (the tstock build), so this vhost only
# answers for its own server_name; certbot --nginx adds the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __OTTO_DOMAIN__;
    # Check the raw Host, not $host (which may fall back to server_name). Only the
    # canonical name on the default port may reach the app; the forwarded Host is pinned.
    if ($http_host != __OTTO_DOMAIN__) { return 421; }

    # The steward rejects oversized bodies itself; this only stops nginx from doing it first
    # with a different status. Screenshots and long transcripts fit comfortably.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSockets: the connector relay (/agents/steward/...) and the workspace stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pin Host to this default-port vhost, even if an absolute-form request line and
        # the raw Host header disagree. Do not use $http_host (caller-controlled). For a
        # non-default port, explicitly allow and forward that canonical host:port instead.
        proxy_set_header Host __OTTO_DOMAIN__;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not append the caller's X-Forwarded-For or forward a claimed Cloudflare IP:
        # the Node host uses this address for password/pairing rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Relays idle for minutes between heartbeats, and SSE must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
